[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milu-agent"
version = "0.1.0"
description = "Offline expressive dog face prototype for Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame==2.6.1"]

[project.scripts]
milu = "milu.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff==0.17.4"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
